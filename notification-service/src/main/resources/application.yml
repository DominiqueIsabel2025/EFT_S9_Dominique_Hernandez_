spring:
  application:
    name: notification-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:9000/oauth2/jwks}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer evita que un mensaje corrupto ("poison pill") detenga el consumidor.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: cl.duoc.notification.dto.TransaccionEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"

server:
  port: 8084

app:
  kafka:
    topic-transacciones: banking.transacciones
  alerta:
    monto-alto: 200000

management:
  endpoints:
    web:
      exposure:
        include: health,info
