spring:
  application:
    name: batch-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  batch:
    job:
      enabled: false              # los jobs se lanzan por la API REST, no al arrancar
    jdbc:
      initialize-schema: always
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:9000/oauth2/jwks}

server:
  port: 8105

# Valores por defecto; los reales vienen del Config Server (config-repo/batch-service.yml)
batch:
  input-dir: classpath:data/
  output-dir: ${BATCH_OUTPUT_DIR:./output}
  semana-por-defecto: semana_3
  chunk-size: 50
  threads: 4
  skip-limit: 900
  max-reintentos-job: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
